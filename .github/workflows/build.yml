#
# Autobuild OpenWrt (x-wrt) for the TP-Link TL-R2005KSH LTE router.
#
# Workflow structure is based on P3TERX/Actions-OpenWrt (MIT).
# The device itself is added to the tree by diy-part2.sh:
#   - target/linux/ramips/dts/mt7620a_tplink_tl-r2005ksh.dts
#   - Device/tplink_tl-r2005ksh recipe in target/linux/ramips/image/mt7620.mk
#   - switch layout + MAC entries in mt7620/base-files/etc/board.d/02_network
#

name: Build TL-R2005KSH firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/x-wrt/x-wrt
  REPO_BRANCH: master
  CONFIG_FILE: ap.config
  DIY_P2_SH: diy-part2.sh
  TZ: Europe/Minsk

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex g++ gawk gcc-multilib gettext \
          git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH xwrt
        ln -sf /workdir/xwrt $GITHUB_WORKSPACE/xwrt

    - name: Cache downloaded packages
      uses: actions/cache@v4
      with:
        path: /workdir/xwrt/dl
        key: dl-${{ env.REPO_BRANCH }}-${{ hashFiles('ap.config') }}
        restore-keys: |
          dl-${{ env.REPO_BRANCH }}-

    - name: Load custom feeds and device support
      run: |
        if [ -e feeds.conf.default ]; then mv feeds.conf.default xwrt/feeds.conf.default; fi
        chmod +x $DIY_P2_SH

    - name: Update feeds
      run: |
        cd xwrt
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd xwrt
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cp $CONFIG_FILE xwrt/.config
        cd xwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download packages
      run: |
        cd xwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      run: |
        cd xwrt
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      run: |
        cd xwrt/bin/targets/*/*
        rm -rf packages
        ls -lh
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "TAG=build-$(date +%Y.%m.%d)-${{ github.run_number }}" >> $GITHUB_ENV

    - name: Upload firmware artifact
      uses: actions/upload-artifact@main
      with:
        name: tl-r2005ksh-firmware-${{ env.TAG }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: error

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: TL-R2005KSH OpenWrt ${{ env.TAG }}
        body: |
          Autobuilt x-wrt (OpenWrt) image for the TP-Link TL-R2005KSH.

          Flash `…-tplink_tl-r2005ksh-squashfs-factory.bin` at flash offset
          `0x80000` (e.g. from the Breed recovery shell:
          `flash erase 0x80000 …` + `flash write verify 0x80000 <ramaddr> <size>`
          after loading the image into RAM), then `boot flash 0x80000`.
        files: ${{ env.FIRMWARE }}/*
        fail_on_unmatched_files: true
